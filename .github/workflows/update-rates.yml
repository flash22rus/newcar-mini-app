name: Update CBR Rates

on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get CBR rates
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime

          date = datetime.now().strftime("%d/%m/%Y")
          url = f"https://www.cbr.ru/scripts/XML_daily.asp?date_req={date}"

          data = urllib.request.urlopen(url, timeout=30).read()
          root = ET.fromstring(data)

          rates = {
              "date": datetime.now().strftime("%d.%m.%Y"),
              "updated": datetime.now().strftime("%d.%m.%Y %H:%M")
          }

          for item in root.findall("Valute"):
              code = item.findtext("CharCode")
              nominal = int(item.findtext("Nominal"))
              value = float(
                  item.findtext("Value").replace(",", ".")
              ) / nominal

              if code in ["JPY", "CNY", "KRW", "EUR"]:
                  rates[code] = value

          with open("rates.json", "w", encoding="utf-8") as f:
              json.dump(rates, f, ensure_ascii=False, indent=2)

          print(json.dumps(rates, ensure_ascii=False, indent=2))
          PY

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Update CBR rates"
          git push
